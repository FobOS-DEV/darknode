services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpn-telegram-bot
    init: true
    restart: unless-stopped
    env_file:
      - .env
    stop_grace_period: 20s
    working_dir: /app
    volumes:
      - ./backups:/app/backups
      - ./prisma:/app/prisma
