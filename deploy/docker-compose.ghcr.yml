services:
  bot:
    image: ghcr.io/fobos-dev/darknode:latest
    container_name: darknode-bot
    init: true
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      DATABASE_URL: file:/app/prisma/dev.db
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 20s
    volumes:
      - ./backups:/app/backups
      - ./prisma:/app/prisma
  reminders:
    image: ghcr.io/fobos-dev/darknode:latest
    container_name: darknode-reminders
    init: true
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      DATABASE_URL: file:/app/prisma/dev.db
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 20s
    command:
      - sh
      - -c
      - while true; do npm run reminders:send; sleep "${REMINDER_INTERVAL_SECONDS:-86400}"; done
    volumes:
      - ./backups:/app/backups
      - ./prisma:/app/prisma
  traffic-snapshots:
    image: ghcr.io/fobos-dev/darknode:latest
    container_name: darknode-traffic-snapshots
    init: true
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      DATABASE_URL: file:/app/prisma/dev.db
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 20s
    command:
      - sh
      - -c
      - while true; do npm run traffic:snapshot; sleep "${TRAFFIC_SNAPSHOT_INTERVAL_SECONDS:-3600}"; done
    volumes:
      - ./backups:/app/backups
      - ./prisma:/app/prisma
