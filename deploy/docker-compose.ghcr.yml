services:
  bot:
    image: ghcr.io/fobos-dev/darknode:latest
    container_name: darknode-bot
    init: true
    restart: unless-stopped
    env_file:
      - .env.server
    stop_grace_period: 20s
    volumes:
      - ./backups:/app/backups
      - ./prisma:/app/prisma
  reminders:
    image: ghcr.io/fobos-dev/darknode:latest
    container_name: darknode-reminders
    init: true
    restart: unless-stopped
    env_file:
      - .env.server
    stop_grace_period: 20s
    command:
      - sh
      - -c
      - while true; do npm run reminders:send; sleep "${REMINDER_INTERVAL_SECONDS:-86400}"; done
    volumes:
      - ./backups:/app/backups
      - ./prisma:/app/prisma
